<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="450" fill="#fafaf7"/>

  <!-- Headline -->
  <text x="600" y="38" text-anchor="middle" font-size="22" fill="#2c3e50" font-weight="600">From your data to a publishable 3D reconstruction in Blender</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#6a7b8c" font-style="italic">Five moments in EM Tools &#8212; the panels follow this order</text>

  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8b2bc"/>
    </marker>
  </defs>

  <!-- Connecting arrows -->
  <g stroke="#a8b2bc" stroke-width="1.5" fill="none">
    <line x1="252" y1="215" x2="271" y2="215" marker-end="url(#arrowB)"/>
    <line x1="477" y1="215" x2="496" y2="215" marker-end="url(#arrowB)"/>
    <line x1="702" y1="215" x2="721" y2="215" marker-end="url(#arrowB)"/>
    <line x1="927" y1="215" x2="946" y2="215" marker-end="url(#arrowB)"/>
  </g>

  <!-- Stage 1: Import -->
  <g transform="translate(50,100)">
    <rect width="200" height="230" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
    <g transform="translate(56,30)">
      <!-- GraphML icon: small file with graph nodes -->
      <rect x="0" y="0" width="40" height="50" fill="#ffffff" stroke="#2c3e50" stroke-width="1" rx="3"/>
      <line x1="6" y1="8" x2="34" y2="8" stroke="#7d8a96" stroke-width="0.8"/>
      <circle cx="12" cy="22" r="3" fill="#c8541e"/>
      <circle cx="28" cy="20" r="3" fill="#c8541e"/>
      <circle cx="20" cy="36" r="3" fill="#c8541e"/>
      <line x1="12" y1="22" x2="28" y2="20" stroke="#5a6b7a" stroke-width="0.8"/>
      <line x1="12" y1="22" x2="20" y2="36" stroke="#5a6b7a" stroke-width="0.8"/>
      <line x1="28" y1="20" x2="20" y2="36" stroke="#5a6b7a" stroke-width="0.8"/>
      <!-- 3D cube isometric -->
      <g transform="translate(50,8)">
        <polygon points="0,12 18,4 36,12 18,20" fill="#d8c9a8" stroke="#2c3e50" stroke-width="1"/>
        <polygon points="0,12 0,32 18,40 18,20" fill="#bfae87" stroke="#2c3e50" stroke-width="1"/>
        <polygon points="36,12 36,32 18,40 18,20" fill="#e8dfc8" stroke="#2c3e50" stroke-width="1"/>
      </g>
    </g>
    <text x="100" y="152" text-anchor="middle" font-size="17" fill="#2c3e50" font-weight="600">Import</text>
    <text x="100" y="172" text-anchor="middle" font-size="13" fill="#6a7b8c" font-style="italic">graph + 3D content</text>
    <text x="100" y="200" text-anchor="middle" font-size="13" fill="#2c3e50">GraphML &#183; meshes</text>
    <text x="100" y="218" text-anchor="middle" font-size="13" fill="#2c3e50">DosCo &#183; em_data.xlsx</text>
  </g>

  <!-- Stage 2: Setup -->
  <g transform="translate(275,100)">
    <rect width="200" height="230" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
    <g transform="translate(58,28)">
      <!-- Blender N-panel sketch -->
      <rect x="0" y="0" width="84" height="76" fill="#fafaf7" stroke="#2c3e50" stroke-width="1" rx="3"/>
      <!-- tabs row -->
      <rect x="2" y="2" width="22" height="11" fill="#c8541e" stroke="none" rx="1.5"/>
      <rect x="26" y="2" width="22" height="11" fill="#dcd0b4" stroke="none" rx="1.5"/>
      <rect x="50" y="2" width="22" height="11" fill="#dcd0b4" stroke="none" rx="1.5"/>
      <text x="13" y="11" text-anchor="middle" font-size="7" fill="#ffffff" font-weight="600">EM</text>
      <text x="37" y="11" text-anchor="middle" font-size="6" fill="#5a6b7a">Annot</text>
      <text x="61" y="11" text-anchor="middle" font-size="6" fill="#5a6b7a">Bridge</text>
      <!-- panel rows -->
      <rect x="6" y="20" width="72" height="10" fill="#ffffff" stroke="#9aa6b1" stroke-width="0.6" rx="1.5"/>
      <rect x="6" y="34" width="72" height="10" fill="#ffffff" stroke="#9aa6b1" stroke-width="0.6" rx="1.5"/>
      <rect x="6" y="48" width="72" height="10" fill="#ffffff" stroke="#9aa6b1" stroke-width="0.6" rx="1.5"/>
      <rect x="6" y="62" width="72" height="10" fill="#ffffff" stroke="#9aa6b1" stroke-width="0.6" rx="1.5"/>
    </g>
    <text x="100" y="152" text-anchor="middle" font-size="17" fill="#2c3e50" font-weight="600">Setup</text>
    <text x="100" y="172" text-anchor="middle" font-size="13" fill="#6a7b8c" font-style="italic">scene &amp; panels</text>
    <text x="100" y="200" text-anchor="middle" font-size="13" fill="#2c3e50">EM Setup &#183; data tree</text>
    <text x="100" y="218" text-anchor="middle" font-size="13" fill="#2c3e50">DosCo path linked</text>
  </g>

  <!-- Stage 3: Annotate (accent) -->
  <g transform="translate(500,100)">
    <rect width="200" height="230" rx="6" fill="#ffffff" stroke="#c8541e" stroke-width="1.5"/>
    <rect width="200" height="5" rx="2" fill="#c8541e"/>
    <g transform="translate(58,32)">
      <!-- arch silhouette with proxy boxes -->
      <path d="M0,76 L0,40 Q42,4 84,40 L84,76 Z" fill="#e8dfc8" stroke="#2c3e50" stroke-width="1"/>
      <!-- proxy boxes overlaid -->
      <rect x="6" y="46" width="22" height="28" fill="none" stroke="#c8541e" stroke-width="1.5" stroke-dasharray="3,2"/>
      <rect x="56" y="46" width="22" height="28" fill="none" stroke="#c8541e" stroke-width="1.5" stroke-dasharray="3,2"/>
      <rect x="30" y="14" width="24" height="22" fill="none" stroke="#c8541e" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- annotation pins (small circles tied to proxies) -->
      <circle cx="17" cy="46" r="3" fill="#c8541e"/>
      <circle cx="67" cy="46" r="3" fill="#c8541e"/>
      <circle cx="42" cy="14" r="3" fill="#c8541e"/>
    </g>
    <text x="100" y="152" text-anchor="middle" font-size="17" fill="#2c3e50" font-weight="600">Annotate</text>
    <text x="100" y="172" text-anchor="middle" font-size="13" fill="#c8541e" font-style="italic">proxies &amp; paradata</text>
    <text x="100" y="200" text-anchor="middle" font-size="13" fill="#2c3e50">Stratigraphy Mgr</text>
    <text x="100" y="218" text-anchor="middle" font-size="13" fill="#2c3e50">Proxy Box &#183; sources</text>
  </g>

  <!-- Stage 4: Reconstruct -->
  <g transform="translate(725,100)">
    <rect width="200" height="230" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
    <g transform="translate(58,30)">
      <!-- stacked epochs / time -->
      <rect x="0" y="0" width="84" height="14" fill="#dcd0b4" stroke="#2c3e50" stroke-width="1"/>
      <rect x="0" y="16" width="84" height="14" fill="#c4a988" stroke="#2c3e50" stroke-width="1"/>
      <rect x="0" y="32" width="84" height="14" fill="#a18563" stroke="#2c3e50" stroke-width="1"/>
      <rect x="0" y="48" width="84" height="14" fill="#7a6244" stroke="#2c3e50" stroke-width="1"/>
      <!-- time arrow -->
      <line x1="-4" y1="68" x2="88" y2="68" stroke="#5a6b7a" stroke-width="1" marker-end="url(#arrowB)"/>
      <text x="42" y="77" text-anchor="middle" font-size="8" fill="#5a6b7a" font-style="italic">time</text>
    </g>
    <text x="100" y="152" text-anchor="middle" font-size="17" fill="#2c3e50" font-weight="600">Reconstruct</text>
    <text x="100" y="172" text-anchor="middle" font-size="13" fill="#6a7b8c" font-style="italic">epochs &amp; hypotheses</text>
    <text x="100" y="200" text-anchor="middle" font-size="13" fill="#2c3e50">Epochs &#183; RM</text>
    <text x="100" y="218" text-anchor="middle" font-size="13" fill="#2c3e50">Visual &#183; Cronofilter</text>
  </g>

  <!-- Stage 5: Export -->
  <g transform="translate(950,100)">
    <rect width="200" height="230" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
    <g transform="translate(60,30)">
      <!-- globe -->
      <circle cx="40" cy="40" r="30" fill="#ffffff" stroke="#2c3e50" stroke-width="1.2"/>
      <ellipse cx="40" cy="40" rx="30" ry="12" fill="none" stroke="#2c3e50" stroke-width="0.8"/>
      <ellipse cx="40" cy="40" rx="12" ry="30" fill="none" stroke="#2c3e50" stroke-width="0.8"/>
      <line x1="10" y1="40" x2="70" y2="40" stroke="#2c3e50" stroke-width="0.8"/>
      <!-- outgoing arrow -->
      <path d="M58,18 L74,4" stroke="#c8541e" stroke-width="1.6" fill="none"/>
      <polygon points="74,4 68,4 70,10" fill="#c8541e"/>
      <!-- nodes on globe -->
      <circle cx="56" cy="22" r="3" fill="#c8541e"/>
      <circle cx="22" cy="48" r="3" fill="#c8541e"/>
      <circle cx="44" cy="62" r="3" fill="#c8541e"/>
    </g>
    <text x="100" y="152" text-anchor="middle" font-size="17" fill="#2c3e50" font-weight="600">Export</text>
    <text x="100" y="172" text-anchor="middle" font-size="13" fill="#6a7b8c" font-style="italic">share &amp; publish</text>
    <text x="100" y="200" text-anchor="middle" font-size="13" fill="#2c3e50">Heriverse &#183; GLTF</text>
    <text x="100" y="218" text-anchor="middle" font-size="13" fill="#2c3e50">CSV &#183; statistics</text>
  </g>

  <!-- Bottom note -->
  <text x="600" y="386" text-anchor="middle" font-size="13" fill="#6a7b8c" font-style="italic">EM Tools is the Blender side of the Extended Matrix Framework</text>
  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#95a5a6">Companion tools: yEd (graph) &#183; 3DSC (3D survey) &#183; em_data.xlsx (tabular)</text>
</svg>
