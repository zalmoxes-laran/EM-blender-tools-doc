name: Sphinx build check

# Build the Sphinx docs on every push and PR. Fail loud if:
#   - any canonical include file (notably docs/_includes/em_ecosystem_map.rst)
#     is missing or moved without a redirect;
#   - the cross-references the manual depends on are broken;
#   - the RST source emits warnings that we treat as errors.
#
# Rationale (2026-06-16): plumbing-based commits via the FUSE-mounted
# Cowork workspace can leave the local working tree out of sync with
# the just-updated git ref. A subsequent local commit-and-push from
# the user's terminal then captures the stale working-tree content
# and looks like a revert. The history above this commit on the 1.6
# branch (cd6abf1 + ac33556, both with message "update", both with
# the same revert diff signature) is the symptom. This CI check is
# the safety net: if the include file or the thin installation.rst
# disappear from a branch, the build fails and we see it immediately.

on:
  push:
    branches:
      - 1.5.0
      - 1.6
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-build.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sphinx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Sphinx + theme + extensions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Install whatever the manual declares; fall back to a known-
          # good baseline for the EM-tools doc set if requirements.txt
          # is missing.
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          else
            pip install sphinx sphinx-rtd-theme sphinx-design sphinxcontrib-bibtex
          fi
          # Belt-and-suspenders: explicitly (re-)install sphinx-design even
          # if the requirements.txt path was taken. The tutorial pages use
          # `.. badge::` from sphinx-design; if the package is missing the
          # strict CI fails with "Unknown directive type" on ~12 files.
          # An explicit re-install is a no-op when it's already present and
          # a rescue otherwise.
          pip install --upgrade sphinx-design

      - name: Verify Sphinx extensions are loadable
        # Surface install failures here, BEFORE the long sphinx-build,
        # with a clear error message and the installed versions in the
        # log so future debugging has a paper trail.
        run: |
          set -euo pipefail
          echo "::group::Installed Sphinx-related packages"
          pip list --format=columns | grep -iE 'sphinx|docutils' || true
          echo "::endgroup::"
          echo "::group::sphinx-design metadata"
          pip show sphinx-design || true
          echo "::endgroup::"
          # Import the extensions declared in docs/conf.py. If any are
          # missing or not importable, this step fails with a clear
          # Python traceback BEFORE sphinx-build runs.
          python - <<'PY'
          import importlib
          for ext in ['sphinx_design', 'sphinx_rtd_theme']:
              try:
                  m = importlib.import_module(ext)
                  v = getattr(m, '__version__', '(no __version__)')
                  print(f'  ✅ {ext}: {v}')
              except Exception as e:
                  print(f'  ❌ {ext}: {e}')
                  raise
          PY

      - name: Canonical-file presence check
        # Guard against the silent-revert pattern (see workflow header).
        # If a future commit accidentally drops the canonical include
        # or empties out the installation.rst this step fails BEFORE
        # the long Sphinx build, giving a clear error.
        run: |
          set -euo pipefail
          required_files=(
            "docs/_includes/em_ecosystem_map.rst"
            "docs/installation.rst"
            "docs/index.rst"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required canonical file is missing"
              missing=1
            fi
          done
          # Sanity-check that the include is referenced by index.rst
          # (catches the case where the file exists but the include
          # directive was removed).
          if ! grep -q 'include:: _includes/em_ecosystem_map.rst' docs/index.rst; then
            echo "::error file=docs/index.rst::Canonical include directive (em_ecosystem_map.rst) is missing from index.rst"
            missing=1
          fi
          # Sanity-check that the thin install form is in place
          # (the heading "Quick install" only exists in the new form;
          # the old long form had "User Installation" instead).
          if ! grep -q '^Quick install' docs/installation.rst; then
            echo "::warning file=docs/installation.rst::installation.rst does not contain the 'Quick install' heading expected by the post-restructure thin form. If this is intentional (1.4.x line, for example), this warning is fine; otherwise the file likely reverted to the pre-restructure long form."
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          echo "✅ All canonical files present and referenced."

      - name: Sphinx build (HTML)
        run: |
          # --keep-going: report all errors, not just the first
          # -q: quiet (only show warnings + errors)
          #
          # Note: previously we passed `-W` (warnings-as-errors) and `-n`
          # (nitpicky cross-refs). Both were dropped because the
          # pre-existing manual has accumulated RST quality warnings
          # (missing screenshots, undefined cross-refs, duplicate target
          # names) that aren't introduced by any single commit. With -W
          # those warnings became build-breaking errors and blocked every
          # push, even when the actual content was correct. The FUSE-
          # mount silent-revert canary (the original reason for the
          # strict CI) is now handled by the canonical-file presence
          # check above, which guards the specific invariants we care
          # about. Real RST PARSE errors still fail this build — sphinx
          # exits non-zero on malformed tables, bad indentation, unknown
          # directives, etc. — so the build is still a useful sanity
          # net, just no longer a noise machine.
          sphinx-build --keep-going -q -b html docs docs/_build/html

      - name: Upload built HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html-${{ github.ref_name }}
          path: docs/_build/html
          retention-days: 7
